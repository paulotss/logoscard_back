version: '3.8'

services:
  backend:
    build: .
    image: logoscard_back_image
    container_name: logoscard_back
    working_dir: /app
    restart: always
    ports:
      - 3001:3001
    volumes:
      - ./:/app
    depends_on:
      database:
        condition: service_healthy
    command: npm run dev # ✅ override bash to run your dev server

  database:
    image: mysql:8
    container_name: logoscard_db
    ports:
      - 3307:3306
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=logoscard

    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p123456']
      interval: 10s
      timeout: 5s
      retries: 5
