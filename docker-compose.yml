services:
  backend:
    build: .
    container_name: logoscard_back
    working_dir: /app
    restart: always
    tty: true
    stdin_open: true
    ports:
      - 3001:3001
    volumes:
      - ./:/app:Z
      - app_node_modules:/app/node_modules
    depends_on:
      - database
    networks:
      - logoscard_network

  database:
    image: mysql
    container_name: logoscard_db
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=123456
    networks:
      - logoscard_network
    volumes:
      - mysql_data:/var/lib/mysql

networks:
  logoscard_network:
    driver: bridge

volumes:
  mysql_data:
  app_node_modules: